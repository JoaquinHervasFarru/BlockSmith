[package]
name = "blocksmith-fs-hfsplus"
description = "Parser y reconstrucción de HFS+/HFSX (basado en Apple TN1150)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
blocksmith-fs-core = { version = "0.1.0", path = "../fs-core" }
blocksmith-io = { version = "0.1.0", path = "../io" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[dev-dependencies]
blocksmith-rebuilder = { path = "../rebuilder" }
tempfile = "3.27.0"
