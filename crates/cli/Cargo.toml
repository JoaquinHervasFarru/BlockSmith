[package]
name = "dirforge-cli"
description = "CLI de desarrollo y diagnóstico."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
dirforge-fs-core = { version = "0.1.0", path = "../fs-core" }
dirforge-fs-hfsplus = { version = "0.1.0", path = "../fs-hfsplus" }
dirforge-io = { version = "0.1.0", path = "../io" }
dirforge-partition = { version = "0.1.0", path = "../partition" }
dirforge-smart = { version = "0.1.0", path = "../smart" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
