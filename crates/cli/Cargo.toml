[package]
name = "blocksmith-cli"
description = "CLI de desarrollo y diagnóstico."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
blocksmith-fs-core = { version = "0.1.0", path = "../fs-core" }
blocksmith-fs-hfsplus = { version = "0.1.0", path = "../fs-hfsplus" }
blocksmith-io = { version = "0.1.0", path = "../io" }
blocksmith-partition = { version = "0.1.0", path = "../partition" }
blocksmith-smart = { version = "0.1.0", path = "../smart" }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
blocksmith-rebuilder = { version = "0.1.0", path = "../rebuilder" }
