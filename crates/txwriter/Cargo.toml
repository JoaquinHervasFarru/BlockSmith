[package]
name = "blocksmith-txwriter"
description = "Escritura transaccional con undo log, verificación y rollback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blocksmith-fs-core = { version = "0.1.0", path = "../fs-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

[dev-dependencies]
blocksmith-fs-hfsplus = { path = "../fs-hfsplus" }
blocksmith-io = { path = "../io" }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
