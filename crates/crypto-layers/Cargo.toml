[package]
name = "dirforge-crypto-layers"
description = "Capa genérica de cifrado: BitLocker, LUKS1/2, Core Storage. Expone DecryptingDevice como un BlockDevice más."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8.4"
argon2 = "0.5.3"
dirforge-io = { version = "0.1.0", path = "../io" }
hmac = "0.12.1"
pbkdf2 = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
xts-mode = "0.5.1"
zeroize = { version = "1.8.2", features = ["derive"] }
