[package]
name = "dirforge-app"
description = "Aplicación de escritorio DirForge (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "dirforge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dirforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
dirforge-crypto-layers = { version = "0.1.0", path = "../../crates/crypto-layers" }
dirforge-fs-core = { version = "0.1.0", path = "../../crates/fs-core" }
dirforge-io = { version = "0.1.0", path = "../../crates/io" }
dirforge-smart = { version = "0.1.0", path = "../../crates/smart" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.11.6"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
