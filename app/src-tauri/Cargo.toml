[package]
name = "blocksmith-app"
description = "Aplicación de escritorio BlockSmith (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "blocksmith_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blocksmith"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
blocksmith-crypto-layers = { version = "0.1.0", path = "../../crates/crypto-layers" }
blocksmith-fs-core = { version = "0.1.0", path = "../../crates/fs-core" }
blocksmith-fs-hfsplus = { version = "0.1.0", path = "../../crates/fs-hfsplus" }
blocksmith-health = { version = "0.1.0", path = "../../crates/health" }
blocksmith-helper = { version = "0.1.0", path = "../../helper" }
blocksmith-io = { version = "0.1.0", path = "../../crates/io" }
blocksmith-partition = { version = "0.1.0", path = "../../crates/partition" }
blocksmith-rebuilder = { version = "0.1.0", path = "../../crates/rebuilder" }
blocksmith-smart = { version = "0.1.0", path = "../../crates/smart" }
blocksmith-store = { version = "0.1.0", path = "../../crates/store" }
blocksmith-txwriter = { version = "0.1.0", path = "../../crates/txwriter" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rmp-serde = "1.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.11.6"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
thiserror = "2.0.21"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
