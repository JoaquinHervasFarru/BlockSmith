[package]
name = "blocksmith-agent"
description = "Agente en segundo plano: sondeo S.M.A.R.T. y alertas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
blocksmith-health = { version = "0.1.0", path = "../crates/health" }
blocksmith-smart = { version = "0.1.0", path = "../crates/smart" }
blocksmith-store = { version = "0.1.0", path = "../crates/store" }
clap = { version = "4.5.61", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
